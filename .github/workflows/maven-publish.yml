name: Build HookForge and all plugins

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Locate HookForge project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "pom.xml" && -f "hookforge-paper/pom.xml" ]]; then
            root="."
          elif [[ -f "HookForge/pom.xml" && -f "HookForge/hookforge-paper/pom.xml" ]]; then
            root="HookForge"
          else
            echo "ERROR: Could not find HookForge's root pom.xml and hookforge-paper/pom.xml." >&2
            echo "Repository root:" >&2
            ls -la >&2
            exit 1
          fi
          echo "HOOKFORGE_ROOT=$root" >> "$GITHUB_ENV"
          echo "Located HookForge at: $root"

      - name: Build and install all HookForge Maven modules
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -U \
            -f "$HOOKFORGE_ROOT/pom.xml" clean install

      - name: Collect HookForge Paper plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="build-output/HookForge"
          mkdir -p "$out"
          jars=("$HOOKFORGE_ROOT"/hookforge-paper/target/*.jar)
          copied=0
          for jar in "${jars[@]}"; do
            filename="${jar##*/}"
            [[ "$filename" == original-*.jar || "$filename" == *-sources.jar || "$filename" == *-javadoc.jar ]] && continue
            cp "$jar" "$out/$filename"
            copied=$((copied + 1))
          done
          if (( copied == 0 )); then
            echo "ERROR: HookForge built without producing a JAR in hookforge-paper/target." >&2
            exit 1
          fi
          ls -lah "$out"

      - name: Build every independent plugin under plugins/<PluginName>
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugin_poms=("$HOOKFORGE_ROOT"/plugins/*/pom.xml)
          if (( ${#plugin_poms[@]} == 0 )); then
            echo "No independent plugins found under $HOOKFORGE_ROOT/plugins/<PluginName>/. HookForge itself was built above."
          fi
          for pom in "${plugin_poms[@]}"; do
            dir="${pom%/pom.xml}"
            name="${dir##*/}"
            echo "Building plugin: $name ($pom)"
            mvn --batch-mode --no-transfer-progress -U -f "$pom" clean package

            out="build-output/$name"
            mkdir -p "$out"
            jars=("$dir"/target/*.jar)
            copied=0
            for jar in "${jars[@]}"; do
              filename="${jar##*/}"
              [[ "$filename" == original-*.jar || "$filename" == *-sources.jar || "$filename" == *-javadoc.jar ]] && continue
              cp "$jar" "$out/$filename"
              copied=$((copied + 1))
            done
            if (( copied == 0 )); then
              echo "ERROR: $name did not produce a distributable JAR." >&2
              exit 1
            fi
          done

      - name: Upload JARs as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-plugin-jars-${{ github.run_number }}
          path: build-output/
          if-no-files-found: error
          retention-days: 30

      - name: Attach JARs to the GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build-output -type f -name '*.jar' -print)
          if (( ${#jars[@]} == 0 )); then
            echo "No JAR files found to attach to release." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${jars[@]}" --clobber
