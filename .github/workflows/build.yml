name: Build HookForge and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Chạy tự động và tạo Release khi bạn push tag dạng v1.0, v1.0.0,...
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI

permissions:
  contents: write # Cấp quyền tạo Release và upload tài nguyên lên repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Lấy nguồn mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Thiết lập môi trường Node.js (phù hợp với dự án JavaScript / Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Giúp tăng tốc lần build sau bằng cách cache node_modules

      # Step 3: Cài đặt các thư viện phụ thuộc (Dependencies)
      - name: Install dependencies
        run: npm ci

      # Step 4: Chạy lệnh Build (nếu dự án của bạn có bước build, ví dụ: tsc, webpack, esbuild,...)
      # Nếu dự án không cần compile, bước này có thể bỏ qua hoặc giữ nguyên nếu package.json có script build
      - name: Build project
        run: npm run build --if-present

      # Step 5: Đóng gói các file sản phẩm thành file .zip
      - name: Package build artifacts
        run: |
          zip -r hookforge-release.zip . -x "node_modules/*" ".git/*" ".github/*"

      # Step 6: Tải file Zip lên phần Artifacts của Workflow Run (xem được ở trang tóm tắt build)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookforge-build
          path: hookforge-release.zip

      # Step 7: Tự động tạo GitHub Release & đính kèm file (chỉ chạy khi bạn push tag v*)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hookforge-release.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## HookForge Release ${{ github.ref_name }}
            
            - Tự động đóng gói và phát hành bởi GitHub Actions.
            - Tải file `hookforge-release.zip` bên dưới để sử dụng.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
