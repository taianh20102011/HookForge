diag_economy_disabled_title: "Economy bridge is disabled"
diag_economy_disabled_details: "HookForge will not call Vault Economy with the current configuration."
diag_economy_disabled_solution: "Enable integrations.economy.enabled and set provider to auto or vault to use economy."
diag_vault_missing_title: "Vault was not detected"
diag_vault_missing_details: "The economy bridge requires Vault and an economy plugin that registers a service."
diag_vault_missing_solution: "Install Vault and a compatible economy plugin, then restart the server."
diag_economy_provider_missing_title: "No Economy provider found"
diag_economy_provider_missing_details: "Vault was detected, but no active Economy service is available."
diag_economy_provider_missing_solution: "Check the economy plugin, version compatibility and startup logs."
diag_economy_ready_title: "Economy bridge is ready"
diag_provider_details: "Provider: {provider}"
no_action_needed: "No action required."
diag_placeholders_disabled_title: "Placeholder bridge is disabled"
diag_placeholders_disabled_details: "HookForge will not call PlaceholderAPI with the current configuration."
diag_placeholders_disabled_solution: "Enable integrations.placeholders.enabled and set provider to auto if needed."
diag_papi_missing_title: "PlaceholderAPI was not detected"
diag_papi_missing_details: "Placeholder expansion will return a clear error until PlaceholderAPI is installed."
diag_papi_missing_solution: "Install PlaceholderAPI if your plugin needs placeholder expansion."
diag_papi_unavailable_title: "PlaceholderAPI is not ready"
diag_papi_unavailable_details: "The plugin was detected, but the bridge cannot call its API."
diag_papi_unavailable_solution: "Check PlaceholderAPI API/version compatibility and server logs."
diag_papi_ready_title: "Placeholder bridge is ready"
diag_permissions_disabled_title: "Permission bridge is disabled"
diag_permissions_disabled_details: "HookForge will not perform permission checks through its API."
diag_permissions_disabled_solution: "Enable integrations.permissions.enabled if required."
diag_permissions_ready_title: "Permission bridge is ready"
diag_permissions_details: "Permissions are checked through Bukkit Player#hasPermission."
diag_permissions_luckperms: " LuckPerms was detected; permissions resolved by LuckPerms through Bukkit are reflected here."
explain_profile_desc: "Configuration profile. beginner keeps things simple; advanced exposes more options."
explain_profile_example: "profile: beginner"
explain_profile_note: "Use /hookforge setup beginner or advanced to apply a preset."
explain_economy_enabled_desc: "Enable or disable the economy bridge. When disabled, the economy API will not access Vault."
explain_economy_enabled_example: "enabled: true"
explain_economy_enabled_note: "Requires Vault and an economy plugin that registers a provider."
explain_economy_provider_desc: "Preferred economy adapter. auto detects available adapters; vault requires Vault; none disables the bridge."
explain_economy_provider_example: "provider: auto"
explain_economy_provider_note: "The MVP currently implements Vault Economy."
explain_placeholders_enabled_desc: "Enable or disable the PlaceholderAPI bridge."
explain_placeholders_enabled_example: "enabled: true"
explain_placeholders_enabled_note: "Placeholders not expanded by PAPI may remain unchanged."
explain_placeholders_provider_desc: "Placeholder adapter. auto detects PlaceholderAPI; placeholderapi requires PAPI; none disables the bridge."
explain_placeholders_provider_example: "provider: auto"
explain_placeholders_provider_note: "The MVP supports PlaceholderAPI, not other placeholder engines."
explain_permissions_enabled_desc: "Enable or disable effective permission checks through Bukkit."
explain_permissions_enabled_example: "enabled: true"
explain_permissions_enabled_note: "This checks permissions; it does not grant or revoke them."
explain_diagnostics_level_desc: "Report detail level: info, normal or debug."
explain_diagnostics_level_example: "level: debug"
explain_diagnostics_level_note: "debug adds provider details to test output."
explain_compat_desc: "Enable optional integration status checks in the doctor command."
explain_compat_example: "compatibility-check: true"
explain_compat_note: "When disabled, doctor checks HookForge and config but skips Vault/PAPI."
explain_write_report_desc: "Whether to write diagnostics.json after running doctor."
explain_write_report_example: "write-report: true"
explain_write_report_note: "The report includes server version, integration status and suggested fixes; no player account details."
explain_report_file_desc: "Name of the JSON report file inside plugins/HookForge."
explain_report_file_example: "report-file: diagnostics.json"
explain_report_file_note: "Use a filename only, not a nested or absolute path."
log_report_failure: "Could not write diagnostic report: {error}"
log_setup_failure: "Could not apply preset: {error}"
